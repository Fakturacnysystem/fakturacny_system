[project]
name = "autonomous-investment-robot"
version = "0.1.0"
description = "Production-grade modular autonomous crypto investment robot scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "tenacity>=8.2",
  "prometheus-client>=0.20",
  "matplotlib>=3.8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: opt-in networked integration tests (set RUN_TESTNET=1)"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
