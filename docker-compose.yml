version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  oracle-brain:
    build: .
    command: python3 ./src/autonomous_investment_robot/services/mastermind/oracle_service.py
    depends_on:
      - redis
    environment:
      - NVIDIA_API_KEY=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

  trading-core:
    build: .
    command: python3 god_mode_launcher.py
    depends_on:
      - redis
      - oracle-brain
    restart: always
