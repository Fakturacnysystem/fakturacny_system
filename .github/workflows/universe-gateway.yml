name: universe-gateway-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest sqlalchemy psycopg[binary] redis prometheus-client
      - name: Run unit tests (universe gateway)
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_universe_gateway_contracts.py \
            tests/test_universe_gateway_auth.py \
            tests/test_universe_gateway_projections.py \
            tests/test_universe_gateway_query_service.py \
            tests/test_universe_gateway_app.py

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest redis sqlalchemy psycopg[binary]
      - name: Run redis-stream integration tests
        env:
          PYTHONPATH: src
          AUTONOMOUS_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -q -m integration tests/test_universe_gateway_integration.py

  replay-determinism-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run replay determinism checks
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_replay_golden.py tests/test_replay_golden_perps.py

  runtime-audit-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run runtime audit checks
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_runtime_audit.py

  staging-deploy-gate:
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - replay-determinism-tests
      - runtime-audit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose manifests
        run: |
          docker compose -f docker-compose.universe.yml config >/tmp/universe-compose.yaml
          python3 scripts/validate_deployment_manifests.py
      - name: Generate config freeze artifact
        run: |
          mkdir -p runs/latest
          python3 - <<'PY'
          import hashlib, json, pathlib, time
          root = pathlib.Path(".")
          cfg = root / "config.kraken_spot.live_profit.yaml"
          payload = {
            "generated_at": time.time(),
            "config_path": str(cfg),
            "sha256": hashlib.sha256(cfg.read_bytes()).hexdigest() if cfg.exists() else "missing",
            "schema": "universe_config_freeze_v1",
          }
          out = root / "runs/latest/config_freeze.json"
          out.write_text(json.dumps(payload, sort_keys=True, indent=2), encoding="utf-8")
          print(out)
          PY

  canary-deploy-gate:
    runs-on: ubuntu-latest
    needs: staging-deploy-gate
    steps:
      - uses: actions/checkout@v4
      - name: Canary rollout policy check (paper/canary only)
        run: |
          grep -E "AUTONOMOUS_NODE_ROLE|AUTONOMOUS_DISTRIBUTED_ENABLED" deploy/live-node.env.example >/dev/null
          echo "canary rollout gate passed"

  production-rollout-gate:
    runs-on: ubuntu-latest
    needs: canary-deploy-gate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Production rollout gate
        run: echo "All gates passed: unit, integration, determinism, runtime audit, staging, canary."
