name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Secret scan (tracked files only)
        run: ./scripts/scan_tracked_secrets.sh

      - name: Compile critical Python files
        run: python -m py_compile $(find src -name '*.py' -print)

      - name: Validate config matrix
        run: python ./scripts/validate_config_matrix.py

      - name: Validate deployment syntax
        run: python ./scripts/validate_deployment_syntax.py

      - name: Test
        run: pytest -q
