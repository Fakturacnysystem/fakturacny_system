{
  "mode": "live",
  "safe_mode_default": true,
  "provider_whitelist": ["kraken_spot"],
  "universe": ["BTC/USD"],
  "execution": {
    "provider_id": "kraken_spot",
    "mode": "live_readonly",
    "fee_bps": 30.0,
    "slippage_bps": 8.0,
    "maker_preference": true,
    "maker_timeout_s": 8,
    "kraken_spot": {
      "rest_base_url": "https://api.kraken.com",
      "ws_public_url": "wss://ws.kraken.com/v2",
      "api_key_env": "KRAKEN_SPOT_API_KEY",
      "api_secret_env": "KRAKEN_SPOT_API_SECRET",
      "allow_unknown_permissions": false
    }
  },
  "doctrine": {
    "target_provider": "kraken_spot",
    "product_target": "spot",
    "long_only": true,
    "never_open_new_short_exposure": true,
    "minimum_sell_net_profit_bps": 120.0,
    "enforce_cost_basis_sell_block": true,
    "enforce_net_profit_sell_block": true,
    "block_non_reduce_only_sells": true
  },
  "harmony": {"enabled": true, "default_order_cadence_s": 5.0},
  "market_watch": {
    "enabled": true,
    "blackout_windows": [],
    "entry_block_max_spread_bps": 35.0,
    "entry_degrade_max_spread_bps": 18.0,
    "entry_block_min_depth_notional": 15000.0,
    "entry_degrade_min_depth_notional": 30000.0,
    "liquidity_map_min_depth_notional": 30000.0,
    "block_new_entries_on_blackout": true
  },
  "kraken_spot_non_live": {
    "profile": "full_analysis",
    "emit_operator_bundle": true,
    "emit_replay_bundle": true
  },
  "risk": {
    "max_daily_loss_pct": 1.0,
    "max_weekly_loss_pct": 2.0,
    "max_drawdown_pct": 3.0,
    "max_position_notional": 150.0,
    "max_exposure_notional": 150.0,
    "max_symbol_exposure_notional": 150.0,
    "max_cluster_exposure_notional": 150.0,
    "max_orders_per_min": 5,
    "leverage": 0,
    "target_portfolio_vol": 0.05,
    "cvar_limit_pct": 1.0,
    "stress_loss_limit_pct": 2.0,
    "max_spread_bps": 18.0,
    "min_depth_notional": 15000.0,
    "stale_data_seconds": 30.0,
    "min_margin_buffer": 2.0,
    "max_funding_cost_per_day": 0.0,
    "max_oi_spike_pct": 0.0,
    "max_liquidation_spike": 0.0,
    "divergence_threshold_bps": 10.0,
    "crowding_score_kill": 12.0,
    "crowding_score_medium": 6.0,
    "crowding_score_high": 9.0,
    "crowding_score_extreme": 12.0
  },
  "policy": {
    "confidence_threshold": 0.6,
    "estimated_cost_bps": 38.0,
    "safety_buffer_bps": 2.0,
    "base_risk_budget": 75.0,
    "min_free_quote_reserve_pct": 0.3
  },
  "tco": {"max_total_cost_bps": 60.0, "max_impact_bps": 25.0},
  "storage": {"run_dir": "runs/kraken_spot_readonly_analysis"}
}
