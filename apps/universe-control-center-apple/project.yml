name: UniverseControlCenterApple
options:
  minimumXcodeGenVersion: 2.45.0
configs:
  Debug: debug
  Release: release
targets:
  UniverseControlCenter:
    type: application
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinholik.universecontrolcenter
        PRODUCT_NAME: Universe Control Center
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
schemes:
  UniverseControlCenter:
    build:
      targets:
        UniverseControlCenter: all
    run:
      config: Debug
